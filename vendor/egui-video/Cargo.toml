[package]
edition = "2021"
name = "egui-video"
version = "0.9.0"
authors = ["n00kii"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "a video library for egui"
readme = "README.md"
license = "MIT"
repository = "https://github.com/n00kii/egui-video"

[lib]
name = "egui_video"
path = "src/lib.rs"

[[example]]
name = "main"
path = "examples/main.rs"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.atomic]
version = "0.6.0"

[dependencies.bytemuck]
version = "1.19"
features = ["derive"]

[dependencies.chrono]
version = "0.4.38"

[dependencies.egui]
version = "0.29"

[dependencies.ffmpeg-the-third]
version = "2.0.1"

[dependencies.itertools]
version = "0.13.0"

[dependencies.nom]
version = "7.1.3"

[dependencies.parking_lot]
version = "0.12.3"

[dependencies.ringbuf]
version = "0.4.4"

[dependencies.sdl2]
version = "0.37.0"

[dependencies.tempfile]
version = "3.12.0"
optional = true

[dependencies.timer]
version = "0.2.0"

[dev-dependencies.eframe]
version = "0.29"

[dev-dependencies.rfd]
version = "0.15.0"

[features]
default = ["sdl2/bundled"]
from_bytes = ["dep:tempfile"]
sdl2-bundled = ["sdl2/bundled"]
