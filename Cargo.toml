[package]
name = "rndWalker"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
description = "Random video and audio walker built with Rust and eframe"
license = "MIT"
repository = "https://github.com/dikmri/rndWalker"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = { version = "0.29.1", default-features = true, optional = true }
egui-video = { version = "0.9.0", optional = true }
fastrand = "2.4"
rfd = { version = "0.17", optional = true }
rodio = { version = "0.22.2", optional = true }
self_update = { version = "0.44.0", features = ["archive-zip", "compression-zip-deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui-video", "dep:rfd", "dep:rodio"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
