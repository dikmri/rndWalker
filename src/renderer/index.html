<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src * blob:">
  <title>Random Video Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="player-container">
    <video id="video-player" autoplay></video>
    <audio id="audio-player" autoplay></audio>

    <div id="overlay">
      <div id="volume-indicator" class="indicator hidden">
        <span id="volume-icon">🔊</span>
        <span id="volume-value">100%</span>
      </div>
      <div id="mute-indicator" class="indicator hidden">
        <span>🔇 Muted</span>
      </div>
      <div id="folder-indicator" class="indicator hidden">
        <span id="folder-indicator-text"></span>
      </div>
    </div>

    <button id="settings-btn" title="Settings">⚙</button>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Settings</h2>

      <div class="folder-group" id="folder-group-0">
        <div class="setting-group">
          <label>MP4 Folder 1:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-0-0" readonly>
            <button id="select-mp4-btn-0-0">Browse</button>
            <button id="add-sub-btn-0" class="add-btn">+</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-0-1">
          <label>Folder 1-2:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-0-1" readonly>
            <button id="select-mp4-btn-0-1">Browse</button>
            <button id="remove-sub-btn-0-1" class="remove-btn">-</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-0-2">
          <label>Folder 1-3:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-0-2" readonly>
            <button id="select-mp4-btn-0-2">Browse</button>
            <button id="remove-sub-btn-0-2" class="remove-btn">-</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-0-3">
          <label>Folder 1-4:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-0-3" readonly>
            <button id="select-mp4-btn-0-3">Browse</button>
            <button id="remove-sub-btn-0-3" class="remove-btn">-</button>
          </div>
        </div>
      </div>

      <div class="folder-group" id="folder-group-1">
        <div class="setting-group">
          <label>MP4 Folder 2 (optional):</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-1-0" readonly>
            <button id="select-mp4-btn-1-0">Browse</button>
            <button id="clear-group-btn-1" class="clear-btn">Clear</button>
            <button id="add-sub-btn-1" class="add-btn">+</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-1-1">
          <label>Folder 2-2:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-1-1" readonly>
            <button id="select-mp4-btn-1-1">Browse</button>
            <button id="remove-sub-btn-1-1" class="remove-btn">-</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-1-2">
          <label>Folder 2-3:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-1-2" readonly>
            <button id="select-mp4-btn-1-2">Browse</button>
            <button id="remove-sub-btn-1-2" class="remove-btn">-</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-1-3">
          <label>Folder 2-4:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-1-3" readonly>
            <button id="select-mp4-btn-1-3">Browse</button>
            <button id="remove-sub-btn-1-3" class="remove-btn">-</button>
          </div>
        </div>
      </div>

      <div class="folder-group" id="folder-group-2">
        <div class="setting-group">
          <label>MP4 Folder 3 (optional):</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-2-0" readonly>
            <button id="select-mp4-btn-2-0">Browse</button>
            <button id="clear-group-btn-2" class="clear-btn">Clear</button>
            <button id="add-sub-btn-2" class="add-btn">+</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-2-1">
          <label>Folder 3-2:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-2-1" readonly>
            <button id="select-mp4-btn-2-1">Browse</button>
            <button id="remove-sub-btn-2-1" class="remove-btn">-</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-2-2">
          <label>Folder 3-3:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-2-2" readonly>
            <button id="select-mp4-btn-2-2">Browse</button>
            <button id="remove-sub-btn-2-2" class="remove-btn">-</button>
          </div>
        </div>
        <div class="setting-group sub-folder hidden" id="sub-folder-2-3">
          <label>Folder 3-4:</label>
          <div class="folder-input">
            <input type="text" id="mp4-folder-2-3" readonly>
            <button id="select-mp4-btn-2-3">Browse</button>
            <button id="remove-sub-btn-2-3" class="remove-btn">-</button>
          </div>
        </div>
      </div>

      <div class="setting-group">
        <label for="mp3-folder">MP3 Folder:</label>
        <div class="folder-input">
          <input type="text" id="mp3-folder" readonly>
          <button id="select-mp3-btn">Browse</button>
        </div>
      </div>

      <div class="modal-buttons">
        <button id="save-settings-btn">Save</button>
        <button id="cancel-settings-btn">Cancel</button>
      </div>
    </div>
  </div>

  <div id="info-overlay" class="hidden">
    <div id="info-text"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
