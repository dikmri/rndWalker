name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rndWalker
            archive: rndWalker-${{ github.ref_name }}-x86_64-unknown-linux-gnu.zip
          - os: macos-13
            target: x86_64-apple-darwin
            binary: rndWalker
            archive: rndWalker-${{ github.ref_name }}-x86_64-apple-darwin.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rndWalker
            archive: rndWalker-${{ github.ref_name }}-aarch64-apple-darwin.zip
          - os: windows-2025
            target: x86_64-pc-windows-gnu
            binary: rndWalker.exe
            archive: rndWalker-${{ github.ref_name }}-x86_64-pc-windows-gnu.zip

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Use GNU Rust host on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev libavfilter-dev libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ffmpeg@7 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg

      - name: Configure Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys2 = Join-Path $env:RUNNER_TEMP "setup-msys2\msys2.cmd"
          $mingw = (& $msys2 -c "cygpath -w /mingw64").Trim()
          $pkgConfigUnix = (& $msys2 -c "command -v pkgconf || command -v pkg-config").Trim()
          $pkgConfigPath = (& $msys2 -c "cygpath -w '$pkgConfigUnix'").Trim()
          $pkgConfig = $pkgConfigPath.Replace("\", "/")
          $pkgConfigDir = (Join-Path $mingw "lib\pkgconfig").Replace("\", "/")
          echo "$mingw\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=$pkgConfigDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_ALLOW_CROSS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_EXECUTABLE=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_x86_64_pc_windows_gnu=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_ALLOW_CROSS_x86_64_pc_windows_gnu=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH_x86_64_pc_windows_gnu=$pkgConfigDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CFLAGS=-std=gnu17" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXXFLAGS=-std=gnu++17" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Windows pkg-config
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "PKG_CONFIG=$env:PKG_CONFIG"
          Test-Path -LiteralPath $env:PKG_CONFIG
          & $env:PKG_CONFIG --version
          & $env:PKG_CONFIG --libs --cflags libavutil

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Destination "dist/${{ matrix.binary }}"
          if ("${{ runner.os }}" -eq "Windows") {
            $exe = Resolve-Path -LiteralPath "dist/${{ matrix.binary }}"
            $bashExe = "C:\msys64\usr\bin\bash.exe"
            $cygExe = & $bashExe -lc "cygpath -u '$($exe.Path)'"
            $dlls = & $bashExe -lc "ldd '$cygExe' | awk '/mingw64/ { print `$3 }'"
            foreach ($dll in $dlls) {
              if ($dll) {
                $winPath = & $bashExe -lc "cygpath -w '$dll'"
                Copy-Item -LiteralPath $winPath -Destination dist -Force
              }
            }
          }
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.archive }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.zip
          generate_release_notes: true
